# Gleismesslatte © Dipl.-Ing. (FH) Stefan Klein – Parameter (Dezimalpunkt oder -komma)
# Kann auch im Programmfenster mit "Als Standard speichern" geschrieben werden.
# Reflektorhöhe über SO, senkrecht zur Latte [m]
h = 0.130
# Lattenkonstante: Spurweite = Prismenabstand + c [m] – aus Kalibrierung der Latte eintragen!
c = 0.000
# Sollspurweite [m]: Bezug der Abweichung und Mitte des Paarbereichs
sollspurweite = 1.458
# zwei Punkte sind ein Paar, wenn die Spurweite in Sollspurweite ± Toleranz liegt [m]
toleranz = 0.100
# Gleisachspunkt (kleinste Punktnummer + "Achse") für GML-Paare berechnen: ja | nein
achse = ja
# Bezugsbasis der Überhöhung [m]
bezugsbasis = 1.500
# Nachkommastellen der Meterwerte in der Ausgabe: 3 oder 4
nachkommastellen = 3
# zusätzliches Protokoll zur Überhöhung (<name>_ergebnis_ueberhoehung.txt): ja | nein
ueberhoehungsprotokoll = ja
# Paarbildung: folge = nur aufeinanderfolgende Punkte, frei = beliebige Reihenfolge
paarbildung = folge
# zusätzliche Codes (ohne GML), deren Punkte paarweise zur Gleisachse gerechnet werden –
# OHNE Korrektur; mehrere Codes mit Komma oder Semikolon trennen, z. B. SOL,SOR
achscodes =
# Eingabedatei – Trennzeichen: auto | semikolon | leerzeichen
trennzeichen = auto
# Spaltenfolge: P=Punktnummer R=Rechtswert H=Hochwert Z=Höhe C=Code -=Spalte überspringen
aufbau = P R H Z C
# Anzahl Kopfzeilen, die übersprungen werden (0 bis 5)
kopfzeilen = 0
# Grenzwert der Überhöhung [mm] – EBO § 6 Abs. 3: höchstens 180 mm
maxueberhoehung = 180
# Ergebnis-Punktliste: eingabe = gleicher Aufbau/Trennzeichen/Kopfzeilen wie die Eingabe,
#                      status  = CSV Punkt;Code;R;H;Z;Status
ausgabeformat = eingabe
# Messdateien mit Reflektorhöhe je Punkt (GSI, XML, JXL, Text), mit ; getrennt – leer = Feldwert h
hdateien =
# Höhen der Punktliste: prisma = Prismenmitte (hr = 0 im Instrument),
#                       reduziert = im Instrument um die Reflektorhöhe lotrecht reduziert
hbezug = prisma
# gewählte Spalten je Text-Messdatei (wird über "Höhe suchen" gesetzt)
hspalten =
