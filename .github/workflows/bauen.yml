name: Bauen und testen

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  release:
    types: [ published ]
  workflow_dispatch:

concurrency:
  group: bauen-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Übersetzen, Selbsttest, Gleismesslatte.jar
        run: ./bauen.sh

      - name: Go (Windows-Starter)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Windows-Paket
        run: ./windows/paket_bauen.sh

      - name: Paket als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: Gleismesslatte-Windows
          path: dist/Gleismesslatte_V*_Windows.zip

      - name: Release (automatisch je Version, bei Push auf main oder Tag v*)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*NUMMER = "\(.*\)".*/\1/p' src/de/gleismessung/Version.java)
          TAG="v$VERSION"
          DATEIEN="$(ls dist/Gleismesslatte_V*_Windows.zip) dist/Gleismesslatte.jar"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release dieser Version gibt es schon: Dateien nur bei Tag-Build erneuern
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              gh release upload "$TAG" $DATEIEN --clobber
            else
              echo "Release $TAG existiert bereits – Versionsnummer erhöhen für ein neues Release."
            fi
          else
            gh release create "$TAG" $DATEIEN --target "$GITHUB_SHA" \
              --title "Gleismesslatte V$VERSION" \
              --notes "Windows: Gleismesslatte_V${VERSION}_Windows.zip herunterladen, entpacken, Gleismesslatte.exe starten (Java 17+ erforderlich). Änderungen siehe CHANGELOG.md."
          fi
